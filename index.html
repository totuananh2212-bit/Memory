<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHO LƯU TRỮ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:#050b15;
    overflow:hidden;
    color:#00ff99;
}

/* Background cyber */
#matrix{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* Container */
.container{
    position:relative;
    width:90%;
    max-width:900px;
    margin:50px auto;
    background:rgba(0,0,0,0.75);
    border:2px solid #00ff99;
    box-shadow:0 0 20px #00ff99;
    padding:30px;
    border-radius:15px;
    backdrop-filter:blur(8px);
}

h1{
    text-align:center;
    font-size:45px;
    margin-bottom:20px;
    color:#00ff99;
    text-shadow:0 0 15px #00ff99;
}

.upload-box{
    border:2px dashed #00ff99;
    padding:30px;
    text-align:center;
    border-radius:10px;
    margin-bottom:20px;
}

input[type=file]{
    margin-top:15px;
    color:white;
}

button{
    margin-top:15px;
    padding:12px 25px;
    background:#00ff99;
    color:black;
    border:none;
    cursor:pointer;
    font-weight:bold;
    border-radius:5px;
}

button:hover{
    box-shadow:0 0 15px #00ff99;
}

.file-list{
    max-height:300px;
    overflow-y:auto;
}

.file-item{
    background:#08121f;
    border:1px solid #00ff99;
    margin:10px 0;
    padding:12px;
    border-radius:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.delete{
    background:red;
    color:white;
    padding:5px 10px;
    border:none;
    cursor:pointer;
}

/* Dòng code chạy */
.code-line{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    white-space:nowrap;
    overflow:hidden;
    color:#00ff99;
    font-size:14px;
    text-shadow:0 0 10px #00ff99;
    opacity:0.7;
}

.code-line span{
    display:inline-block;
    padding-left:100%;
    animation:runCode 20s linear infinite;
}

@keyframes runCode{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="code-line">
<span>
010101010101 SYSTEM_ACCESS_GRANTED | DATABASE_CONNECTED | STORAGE_ONLINE | SECURITY_ACTIVE | KHO_LUU_TRU_V1.0
</span>
</div>

<div class="container">
    <h1>KHO LƯU TRỮ</h1>

    <div class="upload-box">
        <h2>Tải tệp lên</h2>
        <p>Hỗ trợ Word, Excel, PDF, ZIP, RAR,...</p>
        <input type="file" id="fileInput" multiple>
        <br>
        <button onclick="saveFiles()">Lưu Danh Sách</button>
    </div>

    <h2>Danh sách tệp</h2>
    <div class="file-list" id="fileList"></div>
</div>

<script>
// MATRIX CYBER EFFECT
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%^&*";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];

for(let i=0;i<columns;i++){
    drops[i]=1;
}

function drawMatrix(){
    ctx.fillStyle="rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff99";
    ctx.font=fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){
        const text=chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
            drops[i]=0;
        }
        drops[i]++;
    }
}
setInterval(drawMatrix,35);

// FILE STORAGE (Tên file)
function saveFiles(){
    const input=document.getElementById("fileInput");
    let files=JSON.parse(localStorage.getItem("storageFiles"))||[];

    for(let file of input.files){
        files.push({
            name:file.name,
            size:file.size
        });
    }

    localStorage.setItem("storageFiles",JSON.stringify(files));
    loadFiles();
}

function loadFiles(){
    const list=document.getElementById("fileList");
    let files=JSON.parse(localStorage.getItem("storageFiles"))||[];

    list.innerHTML="";

    files.forEach((file,index)=>{
        const div=document.createElement("div");
        div.className="file-item";

        div.innerHTML=`
            <span>${file.name} (${(file.size/1024).toFixed(2)} KB)</span>
            <button class="delete" onclick="deleteFile(${index})">Xóa</button>
        `;

        list.appendChild(div);
    });
}

function deleteFile(index){
    let files=JSON.parse(localStorage.getItem("storageFiles"))||[];
    files.splice(index,1);
    localStorage.setItem("storageFiles",JSON.stringify(files));
    loadFiles();
}

loadFiles();
</script>

</body>
</html>
